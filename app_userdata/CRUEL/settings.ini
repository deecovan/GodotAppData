[keybinding]

move_forward="W"
move_backward="S"
move_left="A"
move_right="D"
move_jump="SPACE"
move_crouch="C"
fire="mouse_1"
melee="mouse_2"
kick="Q"
reload="R"
next_weapon_up="mouse_4"
next_weapon_down="mouse_5"
revolver_select="1"
shotgun_select="2"
uzi_select="3"
rifle_select="3"
throw_melee="E"
heal="F"

[joypad]

move_forward="axis_1_-1.0"
move_backward="axis_1_1.0"
move_left="axis_0_-1.0"
move_right="axis_0_1.0"
move_jump="0"
move_crouch="7"
fire="axis_5_1.0"
melee="axis_4_1.0"
kick="8"
reload="10"
next_weapon_up="3"
next_weapon_down="1"
revolver_select="13"
shotgun_select="11"
uzi_select="14"
rifle_select="12"
throw_melee="9"
heal="2"

[video]

fullscreen=true
windowSize=4
vsync=false
fov=80
fpsLimit=1

[gameplay]

invertMouse=false
aimAssist=true
screenShake=true
headTilt=true
screenFlashes=true
mouseSens=14.0
arachnophobia=false

[audio]

musicVolume=0.5
sfxVolume=0.5

[cosmetic]

skinSelected=0
